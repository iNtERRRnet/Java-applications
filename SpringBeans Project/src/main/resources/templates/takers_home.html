<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<title>Library Management System</title>
		<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
		<link rel="stylesheet" href="/styles/style.css">
	</head>
	<body>
		<div class="container-fluid min-vh-100">
			<div class="row h-100">
				<div class="col-md-8 border-right p-3 overflow-auto">
					<h4 class="mb-3">Taker List</h4>
					<div class="scrollable-section">
						<table class="table table-bordered my-table">
							<thead class="thead">
							  <tr>
							    <th>Name</th>
							    <th>Surname</th>
							    <th>Phone Number</th>
							    <th>Email</th>
							    <th>Taker's ID</th>
							    <th>Has taken book?</th>
							    <th colspan="2">Actions</th>
							  </tr>
							</thead>
							<tbody id="takerTableBody">
								<tr th:each="taker: ${listoftakers}">
									<td th:text="${taker.name}"></td>
									<td th:text="${taker.surname}"></td>
									<td th:text="${taker.phoneNumber}"></td>
									<td th:text="${taker.email}"></td>
									<td th:text="BT + ${taker.id}"></td>
									<td th:text="${taker.hasTakenBook == '1' ? 'Yes' : 'No'}"></td>
									<td>
										<a th:href="@{/deleteTaker/{id}(id=${taker.id})}">
											<img src="/images/delete.png" width="20">
										</a>
									</td>
									<td>
										<a th:href="@{/updateTaker/{id}(id=${taker.id})}">
											<img src="/images/update.png" width="30">
										</a>
									</td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>
				
				<div class="col-md-4 p-4">
					<div class="scrollable-section">
						<h5>Update Taker</h5>
						<form th:action="@{/updateTaker}" th:object="${selectedtaker}" method="post" autocomplete="off" class="mb-3">
							<div class="form-group">
								<input type="text" class="form-control" th:field="*{name}" placeholder="Name">
							</div>
							<div class="form-group">
								<input type="text" class="form-control" th:field="*{surname}" placeholder="Surname">
							</div>
							<div class="form-group">
								<input type="text" class="form-control" th:field="*{phoneNumber}" placeholder="Phone Number">
							</div>
							<div class="form-group">
								<input type="text" class="form-control" th:field="*{email}" placeholder="Email">
							</div>
							<div class="form-group">
								<input type="text" class="form-control" th:value="${selectedtaker.id > 0} ? 'BT' + ${selectedtaker.id} : ''" name="idRaw" placeholder="Taker's ID">
							</div>
							<div class="form-group">
								<input type="text" class="form-control" th:value="${selectedtaker.hasTakenBook == '1' ? 'Yes' : (selectedtaker.hasTakenBook == '0' ? 'No' : '')}" name="hasTakenBook" placeholder="Has Taken Book?">
							</div>
							<button type="submit" class="btn btn-primary btn-block">Update</button>
						</form>
			
						<h5>Add Taker</h5>
						<form action="/addTaker" method="post" autocomplete="off" class="mb-3">
							<div class="form-group">
								<input type="text" class="form-control" name="name" placeholder="Name">
							</div>
							<div class="form-group">
								<input type="text" class="form-control" name="surname" placeholder="Surname">
							</div>
							<div class="form-group">
								<input type="text" class="form-control" name="phoneNumber" placeholder="Phone Number">
							</div>
							<div class="form-group">
								<input type="text" class="form-control" name="email" placeholder="Email">
							</div>
							<div class="form-group">
								<input type="text" class="form-control" name="idRaw" placeholder="Taker's ID">
							</div>
							<div class="form-group">
								<input type="text" class="form-control" name="hasTakenBook" placeholder="Has Taken Book?">
							</div>
							<button type="submit" class="btn btn-success btn-block">Add</button>
						</form>
			
						<div class="form-group d-flex">
							<select id="searchField" class="form-control mr-2">
								<option value="name">Name</option>
								<option value="surname">Surname</option>
								<option value="phoneNumber">Phone Number</option>
								<option value="email">Email</option>
								<option value="id">Taker's ID</option>
								<option value="hasTakenBook">Has Taken Book?</option>
							</select>
							<input type="text" id="searchBox" class="form-control" placeholder="Search...">
						</div>
			
						<form action="/books_home" method="get" class="mb-2">
							<button type="submit" class="btn btn-info btn-block">See Books</button>
						</form>
					</div>
				</div>
			</div>
		</div>
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
		<script>
			document.getElementById("searchBox").addEventListener("input", function() 
			{
			    const query = this.value;
				const field = document.getElementById("searchField").value;
				
				let url;
				if(query.trim() === "") 
				{
				    url = "/allTakers";
				} 
				else
				{
				    url = `/searchTakers?field=${encodeURIComponent(field)}&query=${encodeURIComponent(query)}`;
				}
		
			    fetch(url)
			        .then(response => response.json())
			        .then(data => 
					{
			            const tbody = document.getElementById("takerTableBody");
			            tbody.innerHTML = "";
		
			            data.forEach(taker => 
						{
			                const row = document.createElement("tr");
			                row.innerHTML = `
								<td>${taker.name}</td>
								<td>${taker.surname}</td>
								<td>${taker.phoneNumber}</td>
								<td>${taker.email}</td>
								<td>BT${taker.id}</td>
								<td>${taker.hasTakenBook === '1' ? 'Yes' : 'No'}</td>
								<td><a href="/deleteTaker/${taker.id}"><img src="/images/delete.png" width="20"></a></td>
								<td><a href="/updateTaker/${taker.id}"><img src="/images/update.png" width="30"></a></td>
			                `;
			                tbody.appendChild(row);
			            });
			        });
			});
		</script>
	</body>
</html>
